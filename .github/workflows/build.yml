name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  # Superseded pull request runs are cancelled; main runs always finish, so the badge never shows a cancelled run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Only set on pushes to this repo; pull requests from forks build unsigned with the test Glyph key.
      DOT_KEYSTORE_BASE64: ${{ secrets.DOT_KEYSTORE_BASE64 }}
      DOT_KEYSTORE_PASSWORD: ${{ secrets.DOT_KEYSTORE_PASSWORD }}
      DOT_KEY_ALIAS: ${{ secrets.DOT_KEY_ALIAS }}
      DOT_KEY_PASSWORD: ${{ secrets.DOT_KEY_PASSWORD }}
      NOTHING_API_KEY: ${{ secrets.NOTHING_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Prepare release signing
        if: env.DOT_KEYSTORE_BASE64 != ''
        run: |
          echo "$DOT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/dot-release.jks"
          echo "DOT_KEYSTORE=$RUNNER_TEMP/dot-release.jks" >> "$GITHUB_ENV"

      - name: Lint
        run: ./gradlew lintRelease --stacktrace

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: No network permissions
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          if "$aapt2" dump permissions "$apk" | grep -E 'INTERNET|NETWORK_STATE|WIFI_STATE'; then
            echo "Dot must not declare network permissions" >&2; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results-release.html
            app/build/reports/tests/
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dot-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          retention-days: 14
